[project]
name = "cai-eval-platform"
version = "1.0.0"
description = "Model and agentic workflow evaluation platform with Phoenix tracing"
requires-python = ">=3.11"
# Pinned to a known-good, mutually-compatible set (keep in sync with
# docker/Dockerfile and cai_integration/setup_environment.py). arize-phoenix 20.x
# fails to import on Python 3.11 (mutable-default `boolean_names` dataclass); the
# otel/fastapi/pydantic versions are coupled to this phoenix/ragas line. ragas needs
# pillow, which is not always pulled transitively.
dependencies = [
    "arize-phoenix==19.13.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "openinference-instrumentation-openai==0.1.53",
    "openai>=1.0",
    "datasets>=2.14",
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.27",
    "ragas==0.4.3",
    "pillow==12.3.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
